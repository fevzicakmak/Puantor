<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Puantör | İşletme</title><style>*{box-sizing:border-box}body{font-family:system-ui;background:#eef3f9;color:#162235;margin:0;padding:16px}main{max-width:850px;margin:auto}header{display:flex;justify-content:space-between;align-items:center}h1{font-size:24px}.card{background:white;border-radius:16px;padding:18px;margin:12px 0;border:1px solid #dce5ef}input,button{font:inherit;font-size:16px;padding:12px;border-radius:9px;border:1px solid #cad5e2;width:100%;margin:5px 0}button{background:#1d4ed8;color:white;font-weight:700}button.secondary{background:#e2e8f0;color:#172033}li{padding:8px;border-bottom:1px solid #e5e7eb}small{color:#64748b}#status{color:#b91c1c}</style></head><body><main><header><h1>🚜 Puantör İşletme</h1><button id="logout" class="secondary" style="width:auto">Çıkış</button></header><p id="businessName">İşletme yükleniyor…</p><p id="status"></p><section id="app" hidden><div class="card"><h2>Makine ekle</h2><form id="machineForm"><input id="machineName" placeholder="Makine adı" required maxlength="100"><button>Makine Kaydet</button></form><ul id="machines"></ul></div><div class="card"><h2>Müşteri ekle</h2><form id="customerForm"><input id="customerName" placeholder="Müşteri adı" required maxlength="100"><button>Müşteri Kaydet</button></form><ul id="customers"></ul></div><div class="card"><h2>Operatörler ve iş atamaları</h2><p>Bu yeni işletme alanında operatör hesabı ve iş atama modülü henüz etkin değil. Eski işletmenin kayıtları bu alana karışmaz.</p></div></section></main><script type="module">
import {firebaseConfig} from "./firebase-config.js";
import {initializeApp} from "https://www.gstatic.com/firebasejs/13.2.0/firebase-app.js";
import {getAuth,onAuthStateChanged,signOut} from "https://www.gstatic.com/firebasejs/13.2.0/firebase-auth.js";
import {getFirestore,doc,getDoc,collection,onSnapshot,addDoc,serverTimestamp} from "https://www.gstatic.com/firebasejs/13.2.0/firebase-firestore.js";
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app),$=id=>document.getElementById(id);let unsub=[];
$("logout").onclick=()=>signOut(auth).then(()=>location.replace("./giris.html"));
onAuthStateChanged(auth,async user=>{unsub.forEach(f=>f());unsub=[];if(!user){location.replace("./giris.html");return;}try{const profile=await getDoc(doc(db,"users",user.uid));if(!profile.exists()||profile.data().role!=="tenant_admin"||profile.data().tenantId!==user.uid){location.replace("./giris.html");return;}const id=user.uid;$("businessName").textContent=profile.data().businessName+" · Yönetici: "+profile.data().managerName;$("app").hidden=false;for(const type of ["machines","customers"]){unsub.push(onSnapshot(collection(db,"businesses",id,type),snap=>{$(type).replaceChildren(...snap.docs.map(d=>{const li=document.createElement("li");li.textContent=d.data().name||"—";return li;}));},err=>$("status").textContent="Kayıt okuma hatası: "+err.code));}
for(const [form,input,type] of [["machineForm","machineName","machines"],["customerForm","customerName","customers"]]){$(form).onsubmit=async e=>{e.preventDefault();const name=$(input).value.trim();if(!name)return;const b=$(form).querySelector("button");b.disabled=true;try{await addDoc(collection(db,"businesses",id,type),{name,createdAt:serverTimestamp()});$(input).value="";$("status").textContent="";}catch(err){$("status").textContent="Kayıt hatası: "+err.code;}finally{b.disabled=false;}};}}catch(err){$("status").textContent="Yetki kontrolü hatası: "+(err.code||err.message);}});
</script></body></html>
