<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Puantör Live | Operatör Girişi</title>
<style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#142033;background:#e9eef5}*{box-sizing:border-box}
body{margin:0;padding:18px;min-height:100dvh;display:flex;align-items:center;justify-content:center}
main{width:100%;max-width:440px;background:white;border:1px solid #d6e0ed;border-radius:18px;padding:24px;box-shadow:0 8px 32px #14203312}
h1{font-size:25px;margin:0 0 5px}p{color:#64748b;line-height:1.5}label{display:block;font-weight:700;margin:16px 0 5px}
input{width:100%;border:1px solid #cbd5e1;background:#f8fafc;border-radius:10px;padding:14px;font:inherit;font-size:18px}
button{width:100%;border:0;border-radius:10px;background:#0f172a;color:white;padding:15px;font-size:16px;font-weight:750;margin-top:20px}
.notice{border-radius:10px;background:#f1f5f9;padding:12px;font-size:13px;color:#475569}
#error{color:#9a3412;font-weight:650;min-height:1.5em}
a{color:#1d4ed8}
</style></head><body><main>
<h1>🚜 Puantör | Operatör</h1>
<p>Makine çalışma takibi</p>
<form id="operatorLogin" autocomplete="off">
<label for="username">Kullanıcı adı</label>
<input id="username" name="username" required minlength="3" maxlength="32" pattern="[a-z0-9._-]{3,32}" autocapitalize="none" autocomplete="username" spellcheck="false" placeholder="Örn. bekir.36">
<label for="pin">4 haneli PIN</label>
<input id="pin" name="pin" required type="password" inputmode="numeric" pattern="[0-9]{4}" minlength="4" maxlength="4" autocomplete="off" placeholder="••••">
<button type="submit">Giriş yap</button>
</form>
<p id="error" role="status" aria-live="polite"></p>
<div class="notice"><strong>Kurulum aşamasında.</strong> Güvenli PIN doğrulaması henüz etkinleştirilmedi. Bu sayfa PIN'inizi kaydetmez veya sunucuya göndermez. Operatörlere giriş bilgisi dağıtmayın.</div>
<p><a href="./index.html">Mevcut Puantör V19 uygulamasına git</a></p>
</main>
<script>
document.getElementById("operatorLogin").addEventListener("submit",function(e){
 e.preventDefault();
 document.getElementById("error").textContent="Operatör girişi henüz etkin değil. Güvenli doğrulama kurulmadan makine erişimi açılamaz.";
 document.getElementById("pin").value="";
});
</script></body></html>
