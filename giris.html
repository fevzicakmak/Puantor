<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Puantör | Giriş</title>
<style>:root{font-family:system-ui,-apple-system,sans-serif;color:#142033;background:#e9eef5}*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:18px}main{width:100%;max-width:420px;background:white;border:1px solid #d6e0ed;border-radius:20px;padding:28px;box-shadow:0 8px 32px #14203312;text-align:center}h1{margin:8px 0;font-size:30px}p{color:#64748b}form{text-align:left;margin-top:28px}label{display:block;margin:15px 0 6px;font-weight:650}input{width:100%;border:1px solid #cbd5e1;background:#f8fafc;border-radius:10px;padding:14px;font:inherit;font-size:17px}button{width:100%;background:#0f172a;color:white;border:0;border-radius:10px;padding:15px;margin-top:22px;font:inherit;font-weight:750}button:disabled{opacity:.6}.remember{display:flex;align-items:center;gap:9px;margin-top:16px;font-size:14px;font-weight:500}.remember input{width:18px;height:18px;margin:0;accent-color:#0f172a}#status{min-height:24px;font-size:14px;line-height:1.5}small{color:#64748b}.suggestions{border:1px solid #cbd5e1;border-radius:10px;margin-top:4px;overflow:hidden}.suggestions button{display:block;text-align:left;width:100%;margin:0;border:0;border-radius:0;background:white;color:#142033;font-weight:500;padding:11px 14px}.suggestions button+button{border-top:1px solid #e2e8f0}.suggestions button:active{background:#e9eef5}</style></head>
<body><main><div style="font-size:54px">🚜</div><h1>PUANTÖR</h1><p>Makine ve çalışma takip sistemi</p><form id="login"><label for="email">E-posta (yönetici) / Kullanıcı adı (operatör)</label><input id="email" type="text" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" aria-controls="emailSuggestions" aria-autocomplete="list" required><div id="emailSuggestions" class="suggestions" hidden></div><label for="password">Şifre</label><input id="password" type="password" autocomplete="current-password" required><label class="remember"><input id="remember" type="checkbox" checked> Beni Hatırla</label><button id="submit" type="submit">Giriş Yap</button></form><button id="showRegister" type="button" style="background:#e2e8f0;color:#142033">İlk Kayıt / Şifre Oluştur</button><form id="register" hidden><p>Yöneticinizin tanımladığı kullanıcı adıyla kendi şifrenizi oluşturun.</p><label>Kullanıcı adı<input id="regUsername" required minlength="3" maxlength="32" autocomplete="username"></label><label>Yeni şifre (en az 8 karakter)<input id="regPassword" type="password" required minlength="8" autocomplete="new-password"></label><button id="regSubmit" type="submit">Kaydol ve Onay İste</button><button id="backLogin" type="button" style="background:#e2e8f0;color:#142033">Girişe Dön</button></form><p id="status" role="status" aria-live="polite">Oturum kontrol ediliyor…</p><small>Yetkinize göre yönetici veya operatör ekranı açılır.</small></main>
<script type="module">
import {firebaseConfig} from "./firebase-config.js";
import {initializeApp} from "https://www.gstatic.com/firebasejs/13.2.0/firebase-app.js";
import {getAuth,onAuthStateChanged,signInWithEmailAndPassword,createUserWithEmailAndPassword,sendEmailVerification,sendPasswordResetEmail,reload,signOut,setPersistence,browserLocalPersistence,browserSessionPersistence} from "https://www.gstatic.com/firebasejs/13.2.0/firebase-auth.js";
import {getFirestore,doc,getDoc,writeBatch,serverTimestamp} from "https://www.gstatic.com/firebasejs/13.2.0/firebase-firestore.js";
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app),$=id=>document.getElementById(id);
let checking=false,registering=false;const lastLogin=localStorage.getItem("puantor_last_login");if(lastLogin)$("email").value=lastLogin;
async function route(user){if(checking)return;checking=true;$("submit").disabled=true;$("status").textContent="Hesap yetkisi kontrol ediliyor…";
try{const snap=await getDoc(doc(db,"users",user.uid));const role=snap.exists()?snap.data().role:null;
if(role==="admin"){location.replace("./yonetici.html");return}
if(role==="operator"){location.replace("./operator.html");return}
if(role==="pending"){$("status").textContent="Kaydınız oluşturuldu. Yönetici onayı bekleniyor.";return}
$("status").textContent="Hesap henüz yönetici tarafından yetkilendirilmemiş.";await signOut(auth);
}catch(err){$("status").textContent="Yetki kontrolü yapılamadı: "+(err.code||err.message)}
finally{checking=false;$("submit").disabled=false}}
onAuthStateChanged(auth,user=>{if(registering)return;if(user)route(user);else if(!checking)$("status").textContent="Giriş yapmak için bilgilerinizi yazın."},err=>$("status").textContent="Oturum hatası: "+(err.code||err.message));
$("showRegister").onclick=()=>{$("login").hidden=true;$("showRegister").hidden=true;$("register").hidden=false;$("status").textContent="Kullanıcı adınızı ve belirlediğiniz şifreyi girin."};
$("backLogin").onclick=()=>{$("register").hidden=true;$("login").hidden=false;$("showRegister").hidden=false};
$("register").addEventListener("submit",async e=>{e.preventDefault();const b=$("regSubmit");b.disabled=true;registering=true;let cred;try{
 const username=$("regUsername").value.trim().toLowerCase(),password=$("regPassword").value;
 if(!/^[a-z0-9._-]{3,32}$/.test(username))throw Error("Geçerli kullanıcı adı girin.");
 if(password.length<8)throw Error("Şifre en az 8 karakter olmalı.");
 const email=username+"@operators.puantor.invalid";
 cred=await createUserWithEmailAndPassword(auth,email,password);
 const uid=cred.user.uid,opRef=doc(db,"operators",username),userRef=doc(db,"users",uid),batch=writeBatch(db);
 batch.set(userRef,{role:"pending",username,email,machineIds:[],createdAt:serverTimestamp()});
 batch.update(opRef,{pendingUid:uid,updatedAt:serverTimestamp()});
 await batch.commit();
 $("status").textContent="Başvuru alındı. Yönetici onayından sonra giriş yapabilirsiniz.";
 await signOut(auth);$("register").hidden=true;$("login").hidden=false;$("showRegister").hidden=false;
 }catch(err){$("status").textContent="Kayıt başarısız: "+(err.code||err.message)+". Kullanıcı adı önceden alınmışsa yöneticinizle görüşün.";if(cred)await signOut(auth).catch(()=>{})}finally{registering=false;b.disabled=false;$("regPassword").value=""}});
$("login").addEventListener("submit",async e=>{e.preventDefault();$("submit").disabled=true;$("status").textContent="Giriş yapılıyor…";try{await setPersistence(auth,$("remember").checked?browserLocalPersistence:browserSessionPersistence);const login=$("email").value.trim().toLowerCase();const email=login.includes("@")?login:login+"@operators.puantor.invalid";await signInWithEmailAndPassword(auth,email,$("password").value);localStorage.setItem("puantor_last_login",$("email").value)}catch(err){$("status").textContent="Giriş başarısız ("+(err.code||"bilinmeyen hata")+"). Şifre için yöneticinize başvurun.";$("submit").disabled=false}finally{$("password").value=""}});
</script></body></html>
