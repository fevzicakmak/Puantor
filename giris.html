<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Puantör | Giriş</title>
<style>:root{font-family:system-ui,-apple-system,sans-serif;color:#142033;background:#e9eef5}*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:18px}main{width:100%;max-width:420px;background:white;border:1px solid #d6e0ed;border-radius:20px;padding:28px;box-shadow:0 8px 32px #14203312;text-align:center}h1{margin:8px 0;font-size:30px}p{color:#64748b}form{text-align:left;margin-top:28px}label{display:block;margin:15px 0 6px;font-weight:650}input{width:100%;border:1px solid #cbd5e1;background:#f8fafc;border-radius:10px;padding:14px;font:inherit;font-size:17px}button{width:100%;background:#0f172a;color:white;border:0;border-radius:10px;padding:15px;margin-top:22px;font:inherit;font-weight:750}button:disabled{opacity:.6}.remember{display:flex;align-items:center;gap:9px;margin-top:16px;font-size:14px;font-weight:500}.remember input{width:18px;height:18px;margin:0;accent-color:#0f172a}#status{min-height:24px;font-size:14px;line-height:1.5}small{color:#64748b}.suggestions{border:1px solid #cbd5e1;border-radius:10px;margin-top:4px;overflow:hidden}.suggestions button{display:block;text-align:left;width:100%;margin:0;border:0;border-radius:0;background:white;color:#142033;font-weight:500;padding:11px 14px}.suggestions button+button{border-top:1px solid #e2e8f0}.suggestions button:active{background:#e9eef5}</style></head>
<body><main><div style="font-size:54px">🚜</div><h1>PUANTÖR</h1><p>Makine ve çalışma takip sistemi</p><form id="login"><label for="email">E-posta</label><input id="email" type="email" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" aria-controls="emailSuggestions" aria-autocomplete="list" required><div id="emailSuggestions" class="suggestions" hidden></div><label for="password">Şifre</label><input id="password" type="password" autocomplete="current-password" required><label class="remember"><input id="remember" type="checkbox" checked> Beni Hatırla</label><button id="submit" type="submit">Giriş Yap</button></form><button id="resetPassword" type="button" style="background:transparent;color:#334155;margin-top:4px">Şifremi Unuttum</button><button id="showRegister" type="button" style="background:#e2e8f0;color:#142033;margin-top:12px">Operatör Kaydı / Daveti Kabul Et</button><form id="register" hidden><p>Yöneticinizin verdiği davet koduyla kendi hesabınızı oluşturun.</p><label>Davet kodu<input id="regCode" required minlength="32" maxlength="32" autocapitalize="characters" autocomplete="off" placeholder="32 karakterli kod"></label><label>E-posta<input id="regEmail" type="email" required autocomplete="email"></label><label>Şifre (en az 8 karakter)<input id="regPassword" type="password" minlength="8" required autocomplete="new-password"></label><button id="regSubmit" type="submit">Kaydol ve Daveti Kabul Et</button><button id="backLogin" type="button" style="background:#e2e8f0;color:#142033">Girişe Dön</button></form><p id="status" role="status" aria-live="polite">Oturum kontrol ediliyor…</p><small>Yetkinize göre yönetici veya operatör ekranı açılır.</small></main>
<script type="module">
import {firebaseConfig} from "./firebase-config.js";
import {initializeApp} from "https://www.gstatic.com/firebasejs/13.2.0/firebase-app.js";
import {getAuth,onAuthStateChanged,signInWithEmailAndPassword,createUserWithEmailAndPassword,sendEmailVerification,sendPasswordResetEmail,reload,signOut,setPersistence,browserLocalPersistence,browserSessionPersistence} from "https://www.gstatic.com/firebasejs/13.2.0/firebase-auth.js";
import {getFirestore,doc,getDoc,writeBatch,serverTimestamp} from "https://www.gstatic.com/firebasejs/13.2.0/firebase-firestore.js";
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app),$=id=>document.getElementById(id);
let checking=false,registering=false;
$("resetPassword").onclick=async()=>{const email=$("email").value.trim();if(!email){$("status").textContent="Önce e-posta adresinizi yazın.";return}try{await sendPasswordResetEmail(auth,email);$("status").textContent="Bu adres için hesap varsa şifre yenileme bağlantısı gönderildi. E-postanızı kontrol edin."}catch(err){$("status").textContent="Şifre yenileme başarısız: "+(err.code||err.message)}};
$("showRegister").onclick=()=>{$("login").hidden=true;$("showRegister").hidden=true;$("register").hidden=false;$("status").textContent="Davet edilen e-posta adresinizi yazın."};
$("backLogin").onclick=()=>{$("login").hidden=false;$("showRegister").hidden=false;$("register").hidden=true;$("status").textContent=""};
async function claimInvite(user){
 const code=$("regCode").value.trim().toUpperCase();if(!/^[A-F0-9]{32}$/.test(code))throw Error("Geçerli davet kodunu girin.");
 const email=user.email.toLowerCase(),invRef=doc(db,"operators",code),inv=await getDoc(invRef);
 if(!inv.exists()||inv.data().authStatus!=="pending")throw Error("Davet kodu geçersiz veya kullanılmış.");
 const batch=writeBatch(db);
 batch.set(doc(db,"users",user.uid),{role:"operator",email,username:inv.data().username,displayName:inv.data().displayName,machineIds:[],inviteCode:code,createdAt:serverTimestamp()});
 batch.update(invRef,{authUid:user.uid,authStatus:"active",updatedAt:serverTimestamp()});
 await batch.commit();
 $("status").textContent="Davet kabul edildi.";await route(user);
}
$("register").addEventListener("submit",async e=>{e.preventDefault();const b=$("regSubmit");b.disabled=true;registering=true;try{
 const email=$("regEmail").value.trim().toLowerCase(),user=auth.currentUser,code=$("regCode").value.trim().toUpperCase();
 if(!/^[A-F0-9]{32}$/.test(code))throw Error("Davet kodu 32 karakter olmalı.");
 if(user&&user.email?.toLowerCase()===email){await claimInvite(user);return}
 const cred=await createUserWithEmailAndPassword(auth,email,$("regPassword").value);
 await claimInvite(cred.user);
 }catch(err){$("status").textContent="Kayıt: "+(err.message||err.code)}finally{registering=false;b.disabled=false;$("regPassword").value=""}});
const emailKey="puantor-login-emails-v1";
function savedEmails(){try{const v=JSON.parse(localStorage.getItem(emailKey)||"[]");return Array.isArray(v)?v.filter(x=>typeof x==="string"&&x.includes("@")).slice(0,8):[]}catch{return []}}
function saveEmail(email){try{const e=email.trim().toLowerCase();if(!e.includes("@"))return;localStorage.setItem(emailKey,JSON.stringify([e,...savedEmails().filter(x=>x!==e)].slice(0,8)))}catch{}}
function showSuggestions(){const q=$("email").value.trim().toLowerCase(),box=$("emailSuggestions");box.replaceChildren();const matches=savedEmails().filter(x=>x.includes(q));for(const value of matches){const b=document.createElement("button");b.type="button";b.textContent=value;b.addEventListener("click",()=>{$("email").value=value;box.hidden=true;$("password").focus()});box.append(b)}box.hidden=!matches.length}
$("email").addEventListener("focus",showSuggestions);
$("email").addEventListener("input",showSuggestions);
$("email").addEventListener("blur",()=>setTimeout(()=>{$("emailSuggestions").hidden=true},180));

async function route(user){if(checking)return;checking=true;$("submit").disabled=true;$("status").textContent="Hesap yetkisi kontrol ediliyor…";
try{const snap=await getDoc(doc(db,"users",user.uid));const role=snap.exists()?snap.data().role:null;
if(role==="admin"){location.replace("./yonetici.html");return}
if(role==="operator"){location.replace("./operator.html");return}
$("status").textContent="Hesap giriş yaptı ancak henüz yetkilendirilmemiş. Operatör davetini kabul edin.";$("register").hidden=false;$("login").hidden=true;$("showRegister").hidden=true;$("regEmail").value=user.email;
}catch(err){$("status").textContent="Yetki kontrolü yapılamadı: "+(err.code||err.message)}
finally{checking=false;$("submit").disabled=false}}
onAuthStateChanged(auth,user=>{if(registering)return;if(user&&!registering){getDoc(doc(db,"users",user.uid)).then(p=>{if(p.exists())route(user);else {$("register").hidden=false;$("login").hidden=true;$("showRegister").hidden=true;$("regEmail").value=user.email;$("status").textContent="Davet kodunu girip Kaydol ve Daveti Kabul Et butonuna basın."}}).catch(err=>{$("status").textContent="Yetki kontrolü: "+(err.code||err.message)})}else if(!checking)$("status").textContent="Giriş yapmak için bilgilerinizi yazın."},err=>$("status").textContent="Oturum hatası: "+(err.code||err.message));
$("login").addEventListener("submit",async e=>{e.preventDefault();$("submit").disabled=true;$("status").textContent="Giriş yapılıyor…";try{await setPersistence(auth,$("remember").checked?browserLocalPersistence:browserSessionPersistence);await signInWithEmailAndPassword(auth,$("email").value.trim(),$("password").value);saveEmail($("email").value)}catch(err){$("status").textContent="Giriş başarısız ("+(err.code||"bilinmeyen hata")+"). Şifrenizi unuttuysanız Şifremi Unuttum seçeneğini kullanın.";$("submit").disabled=false}finally{$("password").value=""}});
</script></body></html>
