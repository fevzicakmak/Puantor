name: Puantor tenant preview syntax checks
on:
  push:
    branches:
      - main
      - fix/**
      - feature/**
      - feat/**
  pull_request:
  workflow_dispatch:
    inputs:
      prepare_signed_package:
        description: Prepare signed package after all checks (no TestFlight upload)
        type: boolean
        default: false
      team_id:
        description: Apple Developer Team ID (signing only)
        type: string
        default: ''
      bundle_id:
        description: Registered explicit Bundle ID (signing only)
        type: string
        default: ''
      app_version:
        description: App version (signing only)
        type: string
        default: '1.0'
jobs:
  apple-signing:
    if: github.event_name == 'workflow_dispatch' && inputs.prepare_signed_package && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feat/ios-app-store-foundation')
    needs: [syntax, ios-package, ios-simulator, firestore-rules, browser]
    uses: ./.github/workflows/prepare-ios-signing.yml
    with:
      team_id: ${{ inputs.team_id }}
      bundle_id: ${{ inputs.bundle_id }}
      app_version: ${{ inputs.app_version }}
      reviewed_branch: true
  ios-simulator:
    if: github.event_name != 'push' || github.ref == 'refs/heads/main'
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: npm run test:ios && npm run ios:sync
      - name: Compile unsigned iOS Simulator app
        run: |
          xcodebuild -version
          xcodebuild -project ios/App/App.xcodeproj -scheme App \
            -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath .puantor-ios-derived \
            CODE_SIGNING_ALLOWED=NO build
      - name: Package simulator build
        run: ditto -c -k --sequesterRsrc --keepParent .puantor-ios-derived/Build/Products/Debug-iphonesimulator/App.app ios-simulator-app.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-app
          path: ios-simulator-app.zip
          retention-days: 14
      - name: Compile unsigned physical-device archive
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App \
            -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath .puantor-ios-device-derived \
            -archivePath .puantor-ios-archive/Puantor.xcarchive \
            CODE_SIGNING_ALLOWED=NO archive
          python3 scripts/verify-ios-archive.py .puantor-ios-archive/Puantor.xcarchive --report ios-device-archive-report.json
          ditto -c -k --sequesterRsrc --keepParent .puantor-ios-archive/Puantor.xcarchive ios-device-archive.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ios-device-archive
          path: |
            ios-device-archive.zip
            ios-device-archive-report.json
          retention-days: 14
  ios-package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - name: Verify local iOS package boundaries and existing screens
        run: npm run test:ios
      - name: Generate iOS assets and sync native project
        run: npm run ios:sync
  syntax:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check all application and test JavaScript
        run: python3 scripts/check-syntax.py
  firestore-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install locked test dependencies
        run: npm ci --no-audit --no-fund
      - name: Run company isolation and server work-state tests
        run: |
          set -o pipefail
          npm test 2>&1 | tee tenant-firestore-test.log
      - name: Upload emulator test log even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tenant-firestore-test-log
          path: tenant-firestore-test.log
          if-no-files-found: warn
          retention-days: 14
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install locked dependencies
        run: |
          npm ci --no-audit --no-fund
          npm ci --prefix functions --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify browser → Auth/Functions/Firestore → screen on demo emulators
        run: npm run test:e2e
      - name: Upload browser evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-e2e-evidence
          path: test-results/browser
          if-no-files-found: warn
          retention-days: 14
