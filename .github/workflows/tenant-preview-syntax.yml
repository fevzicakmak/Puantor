name: Puantor tenant preview syntax checks
on:
  push:
    branches:
      - main
      - fix/**
      - feature/**
  pull_request:
  workflow_dispatch:
jobs:
  syntax:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check all application and test JavaScript
        run: python3 scripts/check-syntax.py
  firestore-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install locked test dependencies
        run: npm ci --no-audit --no-fund
      - name: Run company isolation and server work-state tests
        run: |
          set -o pipefail
          npm test 2>&1 | tee tenant-firestore-test.log
      - name: Upload emulator test log even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tenant-firestore-test-log
          path: tenant-firestore-test.log
          if-no-files-found: warn
          retention-days: 14
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install locked dependencies
        run: |
          npm ci --no-audit --no-fund
          npm ci --prefix functions --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify browser → Auth/Functions/Firestore → screen on demo emulators
        run: npm run test:e2e
      - name: Upload browser evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-e2e-evidence
          path: test-results/browser
          if-no-files-found: warn
          retention-days: 14
