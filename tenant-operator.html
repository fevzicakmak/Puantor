<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Puantör | İşletme Operatörü</title><style>*{box-sizing:border-box}body{font:16px system-ui;background:#eef3f9;color:#142033;margin:0;padding:16px}main{max-width:680px;margin:auto}.card{background:white;padding:20px;border-radius:16px;margin:12px 0}select{font:inherit;padding:10px;width:100%;margin:8px 0}button{font:inherit;padding:10px;border:0;border-radius:8px;background:#1d4ed8;color:white}#status{color:#b91c1c}li{padding:12px 0;border-bottom:1px solid #ddd}</style></head><body><main><h1>🚜 Puantör Operatör</h1><p id="who">Hesap doğrulanıyor…</p><button id="logout">Çıkış</button><p id="status"></p><div class="card"><h2>Bana Atanan Görevler</h2><ul id="jobs"></ul><h3>Atanan Makine</h3><select id="machineSelect"></select><p id="machineStatus"></p><div id="controls"><button id="start">Başlat</button> <button id="pause">Duraklat</button> <button id="fault">Arıza</button> <button id="finish">Bitir</button></div></div></main><script type="module">
import {firebaseConfig} from "./firebase-config.js";
import {changeTenantMachineState} from "./tenant-operator-controls.js";
import {initializeApp} from "https://www.gstatic.com/firebasejs/13.2.0/firebase-app.js";
import {getAuth,onAuthStateChanged,signOut} from "https://www.gstatic.com/firebasejs/13.2.0/firebase-auth.js";
import {getFirestore,doc,getDoc,collection,query,where,onSnapshot} from "https://www.gstatic.com/firebasejs/13.2.0/firebase-firestore.js";
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app),$=id=>document.getElementById(id);let stop=null,stopMachine=null,tenantId=null,machine=null,busy=false;
const buttons=["start","pause","fault","finish"];
function refresh(){const allowed={start:["idle","paused","broken"],pause:["running"],fault:["idle","running","paused"],finish:["idle","running","paused","broken"]};for(const action of buttons)$(action).disabled=busy||!machine||machine.jobReady!==true||!allowed[action].includes(machine.status);$("machineStatus").textContent=machine?"Durum: "+(machine.status||"—"):"Aktif makine yok";}
for(const action of buttons)$(action).onclick=async()=>{if(!machine||!tenantId)return;const machineId=$("machineSelect").value;let reason="";if(action==="fault"){reason=prompt("Arıza açıklaması")||"";if(!reason.trim())return;}if(action==="finish"&&!confirm("Görevi bitirmek istiyor musunuz?"))return;busy=true;refresh();try{await changeTenantMachineState(db,{tenantId,operatorUid:auth.currentUser.uid,machineId,action,reason});$("status").textContent="İşlem kaydedildi.";}catch(err){$("status").textContent="İşlem hatası: "+(err.code||err.message);}finally{busy=false;refresh();}};
$("logout").onclick=()=>signOut(auth).then(()=>location.replace("./giris.html"));
onAuthStateChanged(auth,async user=>{
 if(stop){stop();stop=null}if(stopMachine){stopMachine();stopMachine=null}machine=null;tenantId=null;refresh()
 if(!user){location.replace("./giris.html");return}
 try{
  const snap=await getDoc(doc(db,"users",user.uid));
  if(!snap.exists()||snap.data().role!=="tenant_operator"||snap.data().active!==true||!snap.data().tenantId)throw Error("Operatör hesabı yetkilendirilmemiş");
  tenantId=snap.data().tenantId;
  $("who").textContent=user.email||"Operatör";
  const q=query(collection(db,"businesses",tenantId,"jobs"),where("operatorUid","==",user.uid));
  stop=onSnapshot(q,result=>{
   $("jobs").replaceChildren(...result.docs.map(d=>{
    const li=document.createElement("li"),job=d.data();
    li.textContent=(job.description||"Görev")+" · "+(job.status||"Atandı");
    return li;
   }));
   $("status").textContent=result.empty?"Henüz atanmış görev yok.":"";
   const active=result.docs.filter(d=>d.data().status!=="done");const select=$("machineSelect"),previous=select.value;select.replaceChildren(...active.map(d=>{const option=document.createElement("option");option.value=d.data().machineId;option.textContent=d.data().description||d.data().machineId;return option;}));if(active.some(d=>d.data().machineId===previous))select.value=previous;subscribeMachine(select.value);
  },err=>$("status").textContent="Görevler okunamadı: "+(err.code||err.message));
  function subscribeMachine(id){if(stopMachine){stopMachine();stopMachine=null}machine=null;refresh();if(!id)return;stopMachine=onSnapshot(doc(db,"businesses",tenantId,"machines",id),snapshot=>{machine=snapshot.exists()&&snapshot.data().operatorUid===user.uid?snapshot.data():null;refresh();},err=>$("status").textContent="Makine okunamadı: "+(err.code||err.message));}
  $("machineSelect").onchange=()=>subscribeMachine($("machineSelect").value);
 }catch(err){$("status").textContent=err.message||String(err)}
});
</script></body></html>
